name: vanventure
services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: vanventure
      POSTGRES_USER: vanventure
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Bitte zuerst node editor/configure.mjs ausführen}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vanventure -d vanventure"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [database]
  web:
    build: .
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PGHOST: db
      PGUSER: vanventure
      PGDATABASE: vanventure
      PGPASSWORD: ${POSTGRES_PASSWORD:?PostgreSQL-Passwort fehlt}
      PORT: "8787"
      EDITOR_HOST: 0.0.0.0
      EDITOR_ORIGIN: https://${DOMAIN:-localhost}
      EDITOR_SECURE_COOKIE: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1}
      EDITOR_SECRET: ${EDITOR_SECRET:?EDITOR_SECRET fehlt}
      EDITOR_SETUP_TOKEN: ${EDITOR_SETUP_TOKEN:?EDITOR_SETUP_TOKEN fehlt}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [database, frontend]
  proxy:
    image: caddy:2-alpine
    profiles: [public]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks: [frontend]
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
networks:
  database:
    internal: true
  frontend:
