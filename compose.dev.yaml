# Local development only. It must be named explicitly, so production commands cannot load it by accident.
services:
  web:
    environment:
      NODE_ENV: development
      EDITOR_ORIGIN: http://localhost:8080
      EDITOR_SECURE_COOKIE: "false"
    ports:
      - "127.0.0.1:8080:8787"
    volumes:
      - .:/app:ro
      - /app/node_modules
