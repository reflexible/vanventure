<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VanVenture · Bildauswahl</title>
  <link rel="stylesheet" href="../photo-viewer.css">
  <style>
    :root { color-scheme: dark; font-family: Inter, Arial, sans-serif; background: #101513; color: #f1f4ef; }
    body { margin: 0; padding: 36px clamp(18px, 5vw, 72px) 72px; }
    header { max-width: 1000px; margin: 0 auto 48px; }
    h1 { margin: 0 0 12px; font-size: clamp(30px, 5vw, 52px); letter-spacing: -.045em; }
    p { color: #b8c6bb; line-height: 1.5; max-width: 760px; }
    section { max-width: 1400px; margin: 0 auto 56px; }
    h2 { border-bottom: 1px solid #39443d; padding-bottom: 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 18px; }
    figure { margin: 0; background: #1b221e; border: 1px solid #303b34; }
    .photo-link { display: block; background: #050706; }
    img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
    figcaption { padding: 12px 14px 14px; font-size: 14px; line-height: 1.35; color: #dce5dc; }
    .proofs img { aspect-ratio: auto; object-fit: contain; }
    .note { font-size: 13px; color: #9caf9e; }
  </style>
</head>
<body>
  <header>
    <h1>Bildauswahl zur Freigabe</h1>
    <p>19 unveränderte Projektkopien aus den drei Reisearchiven. Klick auf ein Foto öffnet die volle Ansicht. Die KI-Proben unten bleiben Entwürfe, bis sie ausdrücklich freigegeben werden.</p>
  </header>

      <figure><a class="photo-link" href="selected-originals/norwegen-2018/P7050302.jpg"><img src="selected-originals/norwegen-2018/P7050302.jpg" alt="Wolken über dem Fjord"></a><figcaption>Wolken über dem Fjord</figcaption></figure>
      <figure><a class="photo-link" href="selected-originals/norwegen-2018/P7060417.jpg"><img src="selected-originals/norwegen-2018/P7060417.jpg" alt="Rast auf der Trolltunga-Tour"></a><figcaption>Rast auf der Trolltunga-Tour</figcaption></figure>
      <figure><a class="photo-link" href="selected-originals/norwegen-2018/P7100481.jpg"><img src="selected-originals/norwegen-2018/P7100481.jpg" alt="Blick über den Lysefjord"></a><figcaption>Blick über den Lysefjord</figcaption></figure>
      <figure><a class="photo-link" href="selected-originals/norwegen-2018/P7100486.jpg"><img src="selected-originals/norwegen-2018/P7100486.jpg" alt="Preikestolen"></a><figcaption>Preikestolen</figcaption></figure>
    </div>
  </section>
