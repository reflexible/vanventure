<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VanVenture · Benutzerverwaltung</title><link rel="stylesheet" href="/editor/editor.css"><link rel="stylesheet" href="/editor/private-account.css"></head><body><main><section id="workspace" class="users-workspace"><p class="eyebrow">PRIVATER BEREICH</p><h1>Benutzerverwaltung</h1><p>Konten, Rollen und freigegebene Google-Adressen verwalten.</p><p id="users-message" role="status"></p><section class="users-section"><h2>Vorhandene Konten</h2><div id="user-list"></div></section><section class="users-section"><h2 id="user-form-title">Neuen Benutzer anlegen</h2><form id="user-form"><label>Benutzername<input name="name" pattern="[a-z0-9][a-z0-9_-]{2,39}" required></label><label>Anzeigename<input name="displayName" maxlength="80" required></label><label>Google-Adresse für die Anmeldung<input name="googleEmail" type="email" autocomplete="email" maxlength="254" placeholder="name@gmail.com"></label><p class="hint">Nur diese vorab hinterlegte Adresse darf sich per Google anmelden. Die Kontozuordnung erfolgt erst nach bestätigter Google-Anmeldung.</p><label>Rolle<select name="role"><option value="editor">Redaktion · Texte bearbeiten</option><option value="admin">Administrator · Benutzer und Freigaben</option></select></label><label>Passwort<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128"></label><label class="checkbox"><input name="enabled" type="checkbox" checked> Konto aktiv</label><div class="toolbar"><button class="primary">Benutzer speichern</button><button type="button" id="new-user">Neuen Benutzer anlegen</button></div></form></section></section></main><script src="/editor/private-nav.js" defer></script><script src="/editor/users.js" defer></script></body></html>
